<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Classify Alzheimer's disease vs cognitively normal from amyloid and tau PET SUVRs, with SHAP explanations." />
    <title>Alzheimer's ML</title>
    <script>
      // Set the theme before first paint (saved choice, else system setting) so it never flashes.
      // src/theme.ts uses the same 'theme' key.
      ;(function () {
        var theme
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
