    <circle cx="42" cy="54.5" r="8"/>
    <circle cx="23" cy="55" r="8.5"/>
    <circle cx="11.5" cy="45.5" r="8"/>
    <circle cx="8.5" cy="32" r="6.5"/>
    <circle cx="13" cy="19.5" r="8"/>
